name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  msrv:
    name: CLI MSRV (Rust 1.96)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: check default CLI at declared MSRV
        run: cargo check --manifest-path agent-harness/Cargo.toml --locked
      - name: check core CLI at declared MSRV
        run: cargo check --manifest-path agent-harness/Cargo.toml --locked --no-default-features

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: test (default / telegram)
        run: cargo test --manifest-path agent-harness/Cargo.toml --locked
      - name: test (core, no telegram)
        run: cargo test --manifest-path agent-harness/Cargo.toml --locked --no-default-features
      - name: check CLI version and help surfaces
        run: |
          cargo run --manifest-path agent-harness/Cargo.toml --locked -- --version
          cargo run --manifest-path agent-harness/Cargo.toml --locked -- --help
          cargo run --manifest-path agent-harness/Cargo.toml --locked -- update --help
          cargo run --manifest-path agent-harness/Cargo.toml --locked -- quality-gate --help
