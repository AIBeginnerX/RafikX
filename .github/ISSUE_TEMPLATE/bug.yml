name: 버그
description: 동작이 이상할 때
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        API 키, 봇 토큰, OAuth 코드는 절대 붙이지 마세요.
  - type: dropdown
    id: os
    attributes:
      label: 운영체제
      options: [Windows, macOS, Linux, 기타]
    validations:
      required: true
  - type: input
    id: ver
    attributes:
      label: rafikx --version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: rafikx ask "..." 를 실행했더니 ...
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: 기대한 결과 / 실제 결과
    validations:
      required: true
