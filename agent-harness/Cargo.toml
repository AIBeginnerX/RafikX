[package]
name = "rafikx"
version = "0.3.4"
edition = "2024"
description = "RafikX ??personal AI coding agent for the terminal and Telegram"
license = "MIT"
repository = "https://github.com/AIBeginnerX/rafikx"
homepage = "https://github.com/AIBeginnerX/rafikx"
readme = "../README.md"
keywords = ["ai", "agent", "cli"]
categories = ["command-line-utilities"]

[lib]
name = "rafikx"
path = "src/lib.rs"

[[bin]]
name = "rafikx"
path = "src/main.rs"

[features]
default = ["telegram", "tui"]
telegram = ["dep:teloxide"]
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = { version = "0.28.1", optional = true, features = ["event-stream"] }
ratatui = { version = "0.29.0", optional = true, default-features = false, features = ["crossterm"] }
dirs = "6.0.0"
futures-util = "0.3.34"
ignore = "0.4.33"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
pulldown-cmark = "0.13.4"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
serde_json = "1.0.151"
similar = "3.1.2"
teloxide = { version = "0.17.0", optional = true, default-features = false, features = ["macros", "ctrlc_handler", "rustls"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "process", "fs", "io-util", "sync", "signal", "net"] }
toml = "1.1.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
