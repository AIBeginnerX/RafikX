[package]
name = "rafikx-desktop"
version = "0.3.4"
edition = "2021"
description = "RafikX desktop ??same harness as the CLI"
default-run = "rafikx-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rafikx = { path = "../../agent-harness", default-features = false }
anyhow = "1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync", "time", "macros"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
